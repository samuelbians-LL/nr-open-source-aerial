      - openair1/SCHED_NR/phy_procedures_nr_gNB.c
    symbols:
      - gNB_dlsch_ulsch_scheduler
      - NR_slot_indication
      - phy_procedures_gNB_TX
      - phy_procedures_gNB_uespec_RX

