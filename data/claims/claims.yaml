schema_version: 1
claims:
  - claim_id: AERIAL-ARCH-001
    question: Does the Aerial NR gNB stack expose both GPU-accelerated PHY and MAC components?
    statement: NVIDIA's Aerial 26.1 documentation identifies Aerial cuPHY as a CUDA-accelerated inline PHY and Aerial cuMAC as a CUDA-accelerated MAC scheduler.
    conclusion_type: confirmed_fact
    evidence_level: E1
    projects:
      - aerial
    limitations: This confirms the documented component boundary and positioning, not source completeness, runtime performance, or standards conformance.
    status: confirmed
    official_url: https://docs.nvidia.com/aerial/cuda-accelerated-ran/latest/index.html
    document_version: "26.1"
    section: "What's New in 25-3; cuPHY and cuMAC documentation entries"
    retrieved_at: 2026-07-20

  - claim_id: OAI-MAINLINE-001
    question: Which current upstream should represent OpenAirInterface in this comparison?
    statement: The current OAI RAN project is published within the Duranta project, and the frozen upstream README identifies the implementation as Duranta OpenAirInterface RAN.
    conclusion_type: confirmed_fact
    evidence_level: E1
    projects:
      - oai
    limitations: The official project page and frozen README establish project identity; they do not by themselves prove that every historical OAI mirror is byte-for-byte synchronized.
    status: confirmed
    official_url: https://openairinterface.org/ran/
    supporting_urls:
      - https://github.com/duranta-project/openairinterface5g/blob/31ffb21a8204ae9706a88eb08606a80fc8eafb3e/README.md
    document_version: "31ffb21a8204ae9706a88eb08606a80fc8eafb3e"
    section: "OAI RAN; Duranta - OpenAirInterface"
    retrieved_at: 2026-07-20

  - claim_id: OCUDU-SUCCESSOR-001
    question: Which maintained upstream should represent srsRAN Project in this comparison?
    statement: OCUDU's official migration guide identifies OCUDU as the successor to srsRAN Project and records the shared fork point as commit 7d6183f.
    conclusion_type: confirmed_fact
    evidence_level: E1
    projects:
      - ocudu
    limitations: Successor status does not imply that post-fork OCUDU behavior or APIs remain identical to the earlier srsRAN Project.
    status: confirmed
    official_url: https://docs.ocudu.org/migration/
    document_version: docs-8b5041e9
    section: Migrating from srsRAN to OCUDU
    retrieved_at: 2026-07-20

  - claim_id: AERIAL-ARCH-002
    question: Where is the CPU/GPU boundary visible in the frozen Aerial source?
    statement: The frozen source separates CPU-side cuPHY/FH orchestration from CUDA PHY and cuMAC kernels in distinct C++ and CUDA translation units.
    conclusion_type: confirmed_fact
    evidence_level: E2
    projects:
      - aerial
    limitations: Static source structure proves implementation placement, but not runtime residency, deadline closure, throughput, or the absence of copies.
    status: confirmed
    repository: aerial
    commit: 29f5870fd84b0176df48b40667c1b8f1740e6d09
    paths:
      - cuPHY-CP/aerial-fh-driver/lib/fronthaul.cpp
      - cuPHY-CP/cuphydriver/src/downlink/phypdsch_aggr.cpp
      - cuPHY/src/cuphy/crc/crc.cu
      - cuMAC/src/4T4R/multiCellScheduler.cu
    symbols:
      - Fronthaul::eal_init
      - PhyPdschAggr::createPhyObj
      - crcDownlinkPdschTransportBlockKernel
      - multiCellSchedulerKernel_svdMmseIrc

  - claim_id: OAI-ARCH-001
    question: How are the MAC scheduler and NR L1 connected in the frozen OAI gNB path?
    statement: The frozen OAI source contains a per-slot MAC scheduler that produces NR scheduling requests consumed by the gNB L1 transmit and receive procedures in the same repository.
    conclusion_type: confirmed_fact
    evidence_level: E2
    projects:
      - oai
    limitations: This establishes the in-repository path only; optional nFAPI, hardware acceleration, and alternative deployment splits require separate claims.
    status: confirmed
    repository: oai
    commit: 31ffb21a8204ae9706a88eb08606a80fc8eafb3e
    paths:
      - openair2/LAYER2/NR_MAC_gNB/gNB_scheduler.c
      - executables/nr-gnb.c
      - openair1/SCHED_NR/phy_procedures_nr_gNB.c
    symbols:
      - gNB_dlsch_ulsch_scheduler
      - NR_slot_indication
      - phy_procedures_gNB_TX
      - phy_procedures_gNB_uespec_RX

  - claim_id: OCUDU-ARCH-001
    question: Is the MAC-to-PHY boundary explicit in the frozen OCUDU source?
    statement: The frozen OCUDU source separates DU-high, DU-low upper PHY, and bidirectional FAPI fastpath translation into distinct C++ components.
    conclusion_type: confirmed_fact
    evidence_level: E2
    projects:
      - ocudu
    limitations: Static component separation does not prove independent deployment, real-time performance, or a particular lower-PHY/RU integration.
    status: confirmed
    repository: ocudu
    commit: 6d44c2a5e5b2a81a4c67460b460ef99e789943cf
    paths:
      - lib/du/du_high/du_high_impl.cpp
      - lib/du/du_low/du_low_impl.cpp
      - lib/fapi_adaptor/mac/p7/mac_to_fapi_fastpath_translator.cpp
      - lib/fapi_adaptor/phy/p7/fapi_to_phy_fastpath_translator.cpp
      - lib/phy/upper/upper_phy_impl.cpp
    symbols:
      - du_high_impl::get_slot_handler
      - du_low_impl::get_upper_phy
      - mac_to_fapi_fastpath_translator::on_new_downlink_scheduler_results
      - fapi_to_phy_fastpath_translator::send_dl_tti_request
      - upper_phy_impl::get_operation_controller

  - claim_id: AERIAL-PUSCH-001
    question: How does the frozen Aerial source orchestrate the NR PUSCH receive pipeline?
    statement: The frozen Aerial source implements PUSCH as a GPU-input receive pipeline with reusable CUDA graph executables, phase-specific CUDA streams and completion events, plus explicit methods for selected output transfers to CPU.
    conclusion_type: confirmed_fact
    evidence_level: E2
    projects:
      - aerial
    limitations: Static source proves the implemented orchestration and transfer boundaries, not that every deployment is zero-copy or that any real-time deadline is met.
    status: confirmed
    repository: aerial
    commit: 29f5870fd84b0176df48b40667c1b8f1740e6d09
    paths:
      - cuPHY/src/cuphy/cuphy_api.h
      - cuPHY/src/cuphy_channels/pusch_rx.cpp
      - cuPHY/src/cuphy_channels/pusch_rx.hpp
      - cuPHY-CP/cuphydriver/src/uplink/phypusch_aggr.cpp
    symbols:
      - cuphySetupPuschRx
      - cuphyRunPuschRx
      - PuschRx::setupCmnPhase1
      - PuschRx::updateFullSlotGraph
      - PuschRx::copyEarlyHarqOutputToCPU
      - PuschRx::copyOutputToCPU

  - claim_id: OAI-PUSCH-001
    question: What execution model is used by the selected frozen OAI PUSCH path?
    statement: The selected frozen OAI gNB PUSCH path uses C procedures, fixed-point complex data, SIMDe vector operations and CPU thread-pool jobs for demodulation and ULSCH decoding.
    conclusion_type: confirmed_fact
    evidence_level: E2
    projects:
      - oai
    limitations: This describes the traced main source path and does not establish the absence of optional accelerator integrations elsewhere in the repository.
    status: confirmed
    repository: oai
    commit: 31ffb21a8204ae9706a88eb08606a80fc8eafb3e
    paths:
      - openair1/SCHED_NR/phy_procedures_nr_gNB.c
      - openair1/PHY/NR_TRANSPORT/nr_ulsch.c
      - openair1/PHY/NR_TRANSPORT/nr_ulsch_demodulation.c
      - openair1/PHY/NR_TRANSPORT/nr_ulsch_decoding.c
    symbols:
      - nr_ulsch_procedures
      - nr_fill_ulsch
      - nr_rx_pusch_tp
      - nr_ulsch_decoding

  - claim_id: OCUDU-PUSCH-001
    question: How does the selected frozen OCUDU path schedule and return PUSCH processing?
    statement: The frozen OCUDU path stores FAPI PUSCH requests in a slot repository, processes them from received-symbol callbacks, and uses processor notifiers and optional codeblock executor tasks to return data, CRC and UCI results.
    conclusion_type: confirmed_fact
    evidence_level: E2
    projects:
      - ocudu
    limitations: The claim covers the traced software upper-PHY path and does not characterize optional hardware decoder implementations or a lower-PHY backend.
    status: confirmed
    repository: ocudu
    commit: 6d44c2a5e5b2a81a4c67460b460ef99e789943cf
    paths:
      - lib/fapi_adaptor/phy/p7/fapi_to_phy_fastpath_translator.cpp
      - lib/phy/upper/uplink_processor_impl.cpp
      - lib/phy/upper/channel_processors/pusch/pusch_processor_impl.cpp
      - lib/phy/upper/channel_processors/pusch/pusch_decoder_impl.cpp
      - lib/fapi_adaptor/phy/p7/phy_to_fapi_results_event_fastpath_translator.cpp
    symbols:
      - fapi_to_phy_fastpath_translator::send_ul_tti_request
      - uplink_processor_impl::process_symbol_pdus
      - uplink_processor_impl::process_pusch
      - pusch_processor_impl::process
      - pusch_decoder_impl::fork_codeblock_task
      - phy_to_fapi_results_event_fastpath_translator::on_new_pusch_results_data

  - claim_id: AERIAL-PDSCH-001
    question: Which CUDA-specific orchestration and fusion mechanisms are implemented in the frozen Aerial PDSCH path?
    statement: The frozen Aerial source implements PDSCH create, setup and run stages with CUDA graph execution, separate LDPC streams and events, CPU or GPU transport-block inputs, and CUDA kernels spanning CRC, LDPC, fused rate-matching-to-modulation and DMRS generation.
    conclusion_type: confirmed_fact
    evidence_level: E2
    projects:
      - aerial
    limitations: Source presence proves implementation structure, not launch counts for a particular configuration, achieved memory-traffic reduction, throughput, latency or deadline closure.
    status: confirmed
    repository: aerial
    commit: 29f5870fd84b0176df48b40667c1b8f1740e6d09
    paths:
      - cuPHY/src/cuphy/cuphy_api.h
      - cuPHY/src/cuphy_channels/pdsch_tx.cpp
      - cuPHY/src/cuphy_channels/pdsch_tx.hpp
      - cuPHY-CP/cuphydriver/src/downlink/phypdsch_aggr.cpp
      - cuPHY/src/cuphy/crc/crc.cu
      - cuPHY/src/cuphy/error_correction/ldpc_encode.cu
      - cuPHY/src/cuphy/dl_rate_matching/dl_rate_matching.cu
      - cuPHY/src/cuphy/pdsch_dmrs/pdsch_dmrs.cu
    symbols:
      - cuphyCreatePdschTx
      - cuphySetupPdschTx
      - cuphyRunPdschTx
      - PhyPdschAggr::setup
      - PhyPdschAggr::run
      - fused_dl_rm_and_modulation
      - fused_dmrs

  - claim_id: OAI-PDSCH-001
    question: What execution and data model is used by the selected frozen OAI PDSCH path?
    statement: The selected frozen OAI PDSCH path carries MAC scheduling output into gNB TX procedures and implements host-buffer CRC, segmentation and LDPC coding followed by fixed-point and SIMDe-assisted PDSCH generation.
    conclusion_type: confirmed_fact
    evidence_level: E2
    projects:
      - oai
    limitations: This is a source-level characterization of the traced main path and is not a performance comparison or an exhaustive exclusion of optional acceleration backends.
    status: confirmed
    repository: oai
    commit: 31ffb21a8204ae9706a88eb08606a80fc8eafb3e
    paths:
      - openair2/LAYER2/NR_MAC_gNB/gNB_scheduler.c
      - openair1/SCHED_NR/phy_procedures_nr_gNB.c
      - openair1/PHY/NR_TRANSPORT/nr_dlsch_coding.c
      - openair1/PHY/NR_TRANSPORT/nr_dlsch.c
    symbols:
      - gNB_dlsch_ulsch_scheduler
      - phy_procedures_gNB_TX
      - nr_dlsch_encoding
      - nr_generate_pdsch

  - claim_id: OCUDU-PDSCH-001
    question: How does the selected frozen OCUDU path execute PDSCH processing?
    statement: The frozen OCUDU path translates FAPI downlink requests into a slot-scoped downlink processor, defers PDSCH work to a task executor, and uses separate encoder and modulator components to write a resource grid before notifying completion.
    conclusion_type: confirmed_fact
    evidence_level: E2
    projects:
      - ocudu
    limitations: This describes the traced software processor path and does not characterize optional hardware encoder implementations or lower-PHY processing.
    status: confirmed
    repository: ocudu
    commit: 6d44c2a5e5b2a81a4c67460b460ef99e789943cf
    paths:
      - lib/fapi_adaptor/phy/p7/fapi_to_phy_fastpath_translator.cpp
      - lib/phy/upper/downlink_processor_multi_executor_impl.cpp
      - lib/phy/upper/channel_processors/pdsch/pdsch_processor_impl.cpp
      - lib/phy/upper/channel_processors/pdsch/pdsch_encoder_impl.cpp
      - lib/phy/upper/channel_processors/pdsch/pdsch_modulator_impl.cpp
    symbols:
      - fapi_to_phy_fastpath_translator::send_dl_tti_request
      - downlink_processor_multi_executor_impl::process_pdsch
      - pdsch_processor_impl::process
      - pdsch_encoder_impl::encode
      - pdsch_modulator_impl::modulate
