    statement: The frozen Aerial source registers CUDA external memory with DPDK, maps it for NIC DMA, receives packet metadata through DOCA GPUNetIO, and runs a CUDA order kernel that validates, orders and decompresses uplink O-RAN packets into PHY input buffers.
