  - claim_id: AERIAL-PUSCH-001
    question: How does the frozen Aerial source orchestrate the NR PUSCH receive pipeline?
    statement: The frozen Aerial source implements PUSCH as a GPU-input receive pipeline with reusable CUDA graph executables, phase-specific CUDA streams and completion events, plus explicit methods for selected output transfers to CPU.
    conclusion_type: confirmed_fact
    evidence_level: E2
    projects:
      - aerial
    limitations: Static source proves the implemented orchestration and transfer boundaries, not that every deployment is zero-copy or that any real-time deadline is met.
    status: confirmed
    repository: aerial
    commit: 29f5870fd84b0176df48b40667c1b8f1740e6d09
    paths:
      - cuPHY/src/cuphy/cuphy_api.h
      - cuPHY/src/cuphy_channels/pusch_rx.cpp
      - cuPHY/src/cuphy_channels/pusch_rx.hpp
      - cuPHY-CP/cuphydriver/src/uplink/phypusch_aggr.cpp
    symbols:
      - cuphySetupPuschRx
      - cuphyRunPuschRx
      - PuschRx::setupCmnPhase1
      - PuschRx::updateFullSlotGraph
      - PuschRx::copyEarlyHarqOutputToCPU
      - PuschRx::copyOutputToCPU

  - claim_id: OAI-PUSCH-001
    question: What execution model is used by the selected frozen OAI PUSCH path?
    statement: The selected frozen OAI gNB PUSCH path uses C procedures, fixed-point complex data, SIMDe vector operations and CPU thread-pool jobs for demodulation and ULSCH decoding.
    conclusion_type: confirmed_fact
    evidence_level: E2
    projects:
      - oai
    limitations: This describes the traced main source path and does not establish the absence of optional accelerator integrations elsewhere in the repository.
    status: confirmed
    repository: oai
    commit: 31ffb21a8204ae9706a88eb08606a80fc8eafb3e
    paths:
      - openair1/SCHED_NR/phy_procedures_nr_gNB.c
      - openair1/PHY/NR_TRANSPORT/nr_ulsch.c
      - openair1/PHY/NR_TRANSPORT/nr_ulsch_demodulation.c
      - openair1/PHY/NR_TRANSPORT/nr_ulsch_decoding.c
    symbols:
