  - claim_id: AERIAL-CODING-001
    question: Which CUDA-specific implementation choices are present in Aerial LDPC and Polar coding?
    statement: The frozen Aerial source contains CUDA LDPC kernels specialized by base graph and lifting size, FP32 and FP16 decoder dispatch, register/shared/global check-to-variable cache variants, batched transport-block encoding, and CUDA Polar encode and decode kernels.
    conclusion_type: confirmed_fact
    evidence_level: E2
    projects:
      - aerial
    limitations: These source mechanisms do not establish codec throughput, latency, numerical equivalence across formats, or an advantage over CPU SIMD without controlled measurements.
    status: confirmed
    repository: aerial
    commit: 29f5870fd84b0176df48b40667c1b8f1740e6d09
    paths:
      - cuPHY/src/cuphy/error_correction/ldpc_encode.cu
      - cuPHY/src/cuphy/error_correction/ldpc2_global.cu
      - cuPHY/src/cuphy/error_correction/ldpc2_kernel.cuh
      - cuPHY/src/cuphy/polar_decoder/polar_decoder.cu
      - cuPHY/src/cuphy/polar_encoder/polar_encoder.cu
    symbols:
