  - claim_id: AERIAL-MIMO-001
    question: How is the frozen Aerial 64T64R SRS-to-beamforming path implemented?
    statement: The frozen Aerial source links GPU SRS channel-estimate tensors to CUDA MU-MIMO UE-grouping kernels and a custom CUDA RZF beamforming kernel that uses shared-memory channel, Gram, inverse and weight arrays indexed by base-station antenna and group layer.
    conclusion_type: confirmed_fact
    evidence_level: E2
    projects:
      - aerial
    limitations: Static source establishes the implemented data structures and algorithms, but not zero-copy in every configuration, numerical stability, supported deployment limits, throughput or slot-deadline closure.
    status: confirmed
    repository: aerial
    commit: 29f5870fd84b0176df48b40667c1b8f1740e6d09
    paths:
      - cuPHY-CP/cuphydriver/src/uplink/physrs_aggr.cpp
      - cuPHY/src/cuphy/srs_chEst/srs_chEst.cu
      - cuMAC/src/64T64R/multiCellMuUeGrp.cu
      - cuMAC/src/64T64R/multiCellBeamform.cu
    symbols:
